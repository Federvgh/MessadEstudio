# ======================================================================
# Nginx Server Caching & Performance Configuration
# Messad Estudio Website
#
# USAGE:
#   1. Include this file in your nginx server block
#   2. Add: include /path/to/nginx-cache.conf;
#   3. Reload nginx: sudo nginx -s reload
# ======================================================================

# ======================================================================
# BROWSER CACHING
# ======================================================================

# HTML - No caching (always fresh)
location ~* \.(html|htm)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

# CSS & JavaScript - Cache for 1 year
location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Images - Cache for 1 year
location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Fonts - Cache for 1 year
location ~* \.(ttf|otf|woff|woff2|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Data files - No caching
location ~* \.(json|xml)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# ======================================================================
# COMPRESSION (GZIP)
# ======================================================================

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/rss+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject
    image/svg+xml;
gzip_disable "msie6";

# ======================================================================
# SECURITY HEADERS
# ======================================================================

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy (adjust as needed)
add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://code.jquery.com https://netdna.bootstrapcdn.com https://alcdn.msauth.net https://accounts.google.com https://ajax.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;

# ======================================================================
# FILE ACCESS
# ======================================================================

# Deny access to sensitive files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ ~$ {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(bak|conf|dist|fla|in[ci]|log|orig|psd|sh|sql|sw[op])$ {
    deny all;
    access_log off;
    log_not_found off;
}

# ======================================================================
# PERFORMANCE OPTIMIZATIONS
# ======================================================================

# Disable access logging for static assets
location ~* \.(jpg|jpeg|png|gif|webp|css|js|woff|woff2|ttf|svg|ico)$ {
    access_log off;
    log_not_found off;
}

# ======================================================================
# OPTIONAL: FORCE HTTPS
# ======================================================================

# Uncomment to force HTTPS
# if ($scheme != "https") {
#     return 301 https://$host$request_uri;
# }

# ======================================================================
# MIME TYPES
# ======================================================================

types {
    # WebP images
    image/webp webp;

    # Web fonts
    font/ttf ttf;
    font/otf otf;
    font/woff woff;
    font/woff2 woff2;
}
